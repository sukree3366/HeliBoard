name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Set COACH_KEYSTORE_BASE64 (plus the two passwords and the alias) as repository secrets to
      # sign with your own key, so a new APK installs over the previous one instead of needing an
      # uninstall. See COACH.md, "Keep your own signing key". Without the secret, the debug
      # keystore generated by Gradle is used and the applicationId keeps its .debug suffix.
      COACH_KEYSTORE_BASE64: ${{ secrets.COACH_KEYSTORE_BASE64 }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradle Wrapper
        run: chmod +x gradlew

      - name: Restore the signing keystore
        if: env.COACH_KEYSTORE_BASE64 != ''
        run: |
          echo "$COACH_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/coach.jks"
          {
            echo "COACH_KEYSTORE_FILE=$RUNNER_TEMP/coach.jks"
            echo "COACH_KEYSTORE_PASSWORD=${{ secrets.COACH_KEYSTORE_PASSWORD }}"
            echo "COACH_KEY_ALIAS=${{ secrets.COACH_KEY_ALIAS }}"
            echo "COACH_KEY_PASSWORD=${{ secrets.COACH_KEY_PASSWORD }}"
          } >> "$GITHUB_ENV"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeliBoard-TypingCoach-Debug
          path: app/build/outputs/apk/debug/*.apk

      # after the upload, so a failing test never hides the APK the phone needs.
      # Only the coach tests: the upstream suite has known failures on this base commit.
      - name: Run typing coach tests
        run: ./gradlew testDebugUnitTest --tests "helium314.keyboard.coach.*" --stacktrace

      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: app/build/reports/tests/
